name: AuraGlass development build and emulator checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile APK and validate Android components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android application
        run: gradle --no-daemon :app:assembleDebug
      - name: Check package, permissions and Island declaration
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          AAPT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep "package: name='com.auraglass.app'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/aura-manifest.txt
          for entry in SetupActivity HomeActivity AuraWallpaperService AuraEventListener android.intent.category.HOME android.service.wallpaper.WallpaperService android.service.notification.NotificationListenerService; do
            grep -q "$entry" /tmp/aura-manifest.txt
          done
          "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraGlass-development-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  smoke:
    name: Android emulator launch and island screenshot
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AuraGlass-development-debug-apk
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p screenshots
            adb install -r app-debug.apk
            adb logcat -c
            sleep 12
            adb shell input keyevent 82
            adb shell am start -W -n com.auraglass.app/.SetupActivity
            sleep 5
            adb shell pidof com.auraglass.app
            adb exec-out screencap -p > screenshots/01-setup.png
            adb shell am start -W -n com.auraglass.app/.HomeActivity
            sleep 3
            adb exec-out screencap -p > screenshots/02-island-collapsed.png
            adb shell input tap 540 165
            sleep 2
            adb exec-out screencap -p > screenshots/03-island-expanded.png
            adb shell am start -W -n com.auraglass.app/.MainActivity
            sleep 2
            adb exec-out screencap -p > screenshots/04-editor.png
            adb shell am start -W -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.auraglass.app/.AuraWallpaperService
            sleep 3
            adb exec-out screencap -p > screenshots/05-wallpaper-preview.png
            adb shell cmd role add-role-holder android.app.role.HOME com.auraglass.app
            adb shell cmd role get-role-holders android.app.role.HOME > screenshots/home-role.txt
            adb shell dumpsys package com.auraglass.app > screenshots/package.txt
            grep -q "AuraEventListener" screenshots/package.txt
            grep -q "AuraWallpaperService" screenshots/package.txt
            grep -q "com.auraglass.app" screenshots/home-role.txt
            ! adb logcat -d -s AndroidRuntime:E | grep -F "Process: com.auraglass.app"
            test "$(stat -c %s screenshots/02-island-collapsed.png)" -gt 90000
            echo "✓ core views and Island opened in emulator"
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuraGlass-development-emulator-screenshots
          path: screenshots/
          if-no-files-found: warn

# No automatic publication. Stable releases require a persistent private signing
# key, real-device verification and an explicit manual release workflow.
