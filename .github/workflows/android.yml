name: Build, Smoke Test & Publish AuraGlass

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile & verify manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK registration
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          AAPT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep "package: name='com.auraglass.app'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q "SetupActivity" /tmp/manifest.txt
          grep -q "HomeActivity" /tmp/manifest.txt
          grep -q "AuraWallpaperService" /tmp/manifest.txt
          grep -q "android.intent.category.HOME" /tmp/manifest.txt
          grep -q "android.service.wallpaper.WallpaperService" /tmp/manifest.txt
          echo "✓ Setup activity, HOME role and live-wallpaper service all registered"
          cp "$APK" AuraGlass-v0.2.2-alpha.apk
          sha256sum AuraGlass-v0.2.2-alpha.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AuraGlass-v0.2.2-alpha-apk
          path: AuraGlass-v0.2.2-alpha.apk
          if-no-files-found: error

  smoke:
    name: Launch & screenshot on Android emulator
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AuraGlass-v0.2.2-alpha-apk
      - name: Allow KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p screenshots
            adb install -r AuraGlass-v0.2.2-alpha.apk
            adb logcat -c
            sleep 12
            adb shell input keyevent 82
            adb shell am start -W -n com.auraglass.app/.SetupActivity
            sleep 7
            adb shell pidof com.auraglass.app
            adb exec-out screencap -p > screenshots/01-setup.png
            test "$(stat -c %s screenshots/01-setup.png)" -gt 120000
            adb shell am start -W -n com.auraglass.app/.HomeActivity
            sleep 3
            adb shell pidof com.auraglass.app
            adb exec-out screencap -p > screenshots/02-home.png
            adb shell am start -W -n com.auraglass.app/.MainActivity
            sleep 2
            adb exec-out screencap -p > screenshots/03-editor.png
            adb shell am start -W -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.auraglass.app/.AuraWallpaperService
            sleep 3
            adb exec-out screencap -p > screenshots/04-wallpaper-preview.png
            adb shell cmd role add-role-holder android.app.role.HOME com.auraglass.app
            adb shell cmd role get-role-holders android.app.role.HOME > screenshots/home-role.txt
            adb shell dumpsys package com.auraglass.app > screenshots/installed-package.txt
            grep -q "AuraWallpaperService" screenshots/installed-package.txt
            grep -q "HomeActivity" screenshots/installed-package.txt
            grep -q "com.auraglass.app" screenshots/home-role.txt
            ! adb logcat -d -s AndroidRuntime:E | grep -F "Process: com.auraglass.app"
            echo "✓ Setup, home and editor open; wallpaper service registered"
      - name: Save emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuraGlass-v0.2.2-emulator-screenshots
          path: screenshots/
          if-no-files-found: warn

  publish:
    name: Publish verified alpha
    if: success()
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AuraGlass-v0.2.2-alpha-apk
      - name: Release APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.2.2-alpha AuraGlass-v0.2.2-alpha.apk \
            --target "${GITHUB_SHA}" \
            --title "AURA GLASS v0.2.2 Alpha · Activation + Wallpaper Tests" \
            --notes "Early Android test build. Includes a clear first-run launcher/live-wallpaper setup, Home default-role flow, Samsung-compatible wallpaper chooser, setup status checks, and editor. Build and Android emulator smoke tests passed. IMPORTANT: this does not establish compatibility with a physical Samsung S24 Ultra or guarantee visual parity with the mockups. Uninstall v0.1 alpha before installing: CI debug signing keys differ between runs." \
            --prerelease
