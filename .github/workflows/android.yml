name: AuraGlass development build and emulator checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile APK and validate Android components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android application
        run: gradle --no-daemon :app:assembleDebug
      - name: Check package, permissions and Island declaration
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          AAPT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep "package: name='com.auraglass.app'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/aura-manifest.txt
          for entry in SetupActivity HomeActivity IceShowcaseActivity AuraWallpaperService AuraEventListener android.intent.category.HOME android.service.wallpaper.WallpaperService android.service.notification.NotificationListenerService; do
            grep -q "$entry" /tmp/aura-manifest.txt
          done
          "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraGlass-development-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  smoke:
    name: Android emulator launch and island screenshot
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AuraGlass-development-debug-apk
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p screenshots
            adb install -r app-debug.apk
            adb logcat -c
            # Avoid AOSP Quickstep launching as default Home while another launcher
            # is being rendered and tested; it produced a system-ANR modal in QA.
            adb shell cmd role add-role-holder android.app.role.HOME com.auraglass.app
            adb shell am force-stop com.android.launcher3 || true
            sleep 7
            adb shell input keyevent 82
            adb shell am start -W -n com.auraglass.app/.SetupActivity
            sleep 5
            adb shell pidof com.auraglass.app
            adb exec-out screencap -p > screenshots/01-setup.png
            # Access internal, non-exported activities through actual app buttons,
            # not from the ADB shell UID, preserving Android component isolation.
            # Debug-only trampoline verifies internal pages without exporting
            # their production manifest components to other applications.
            # Verify persistent folder CRUD using real SharedPreferences in debug APK.
            adb shell am start -W -n com.auraglass.app/.QaEntryActivity --es target folders
            sleep 1
            adb logcat -d -s AURA_QA:I > screenshots/folder-crud.txt
            grep -q 'FOLDERS_OK' screenshots/folder-crud.txt
            adb shell am start -W -n com.auraglass.app/.QaEntryActivity --es target pages
            sleep 1
            adb logcat -d -s AURA_QA:I > screenshots/workspace-pages.txt
            grep -q 'PAGES_OK' screenshots/workspace-pages.txt
            adb shell am start -W -n com.auraglass.app/.QaEntryActivity --es target diagnostics
            sleep 3
            adb shell pidof com.auraglass.app
            adb logcat -d -s AndroidRuntime:E > screenshots/diagnostics-runtime.txt
            adb shell dumpsys activity activities > screenshots/diagnostics-stack.txt
            adb exec-out screencap -p > screenshots/11-diagnostics.png
            grep -q 'DiagnosticsActivity' screenshots/diagnostics-stack.txt
            adb shell input keyevent 4
            sleep 1
            adb shell am start -W -n com.auraglass.app/.HomeActivity
            sleep 3
            adb shell am start -W -n com.auraglass.app/.QaEntryActivity --es target widgets
            sleep 3
            adb shell pidof com.auraglass.app
            adb logcat -d -s AndroidRuntime:E > screenshots/widget-runtime.txt
            adb shell dumpsys activity activities > screenshots/widget-board-stack.txt
            adb exec-out screencap -p > screenshots/10-widget-board.png
            grep -q 'WidgetBoardActivity' screenshots/widget-board-stack.txt
            adb shell input keyevent 4
            sleep 1
            # Grant bind permission only inside this ephemeral emulator.
            # Real users must approve widget binding through the system UI.
            adb shell appwidget grantbind --package com.auraglass.app --user current
            adb shell am start -W -n com.auraglass.app/.QaEntryActivity --es target widget_bind
            sleep 4
            adb logcat -d -s AURA_QA:I > screenshots/widget-bind.txt
            grep -q 'WIDGET_BIND_OK' screenshots/widget-bind.txt
            adb shell am start -W -n com.auraglass.app/.HomeActivity
            sleep 3
            adb exec-out screencap -p > screenshots/12-live-widget-on-home.png
            test "$(stat -c %s screenshots/12-live-widget-on-home.png)" -gt 90000
            adb exec-out screencap -p > screenshots/02-island-collapsed.png
            adb shell input tap 540 165
            sleep 2
            adb exec-out screencap -p > screenshots/03-island-expanded.png
            adb shell am start -W -n com.auraglass.app/.MainActivity
            sleep 2
            adb exec-out screencap -p > screenshots/04-editor.png
            adb shell am start -W -n com.auraglass.app/.IceShowcaseActivity
            sleep 3
            adb exec-out screencap -p > screenshots/06-ice-before.png
            adb shell input swipe 270 1000 810 1420 900
            sleep 1
            adb exec-out screencap -p > screenshots/07-ice-finger-trail.png
            sleep 4
            adb exec-out screencap -p > screenshots/08-ice-refreeze.png
            adb shell am start -W -n com.auraglass.app/.HomeActivity
            sleep 5
            adb exec-out screencap -p > screenshots/09-snowy-glass-home.png
            test "$(stat -c %s screenshots/06-ice-before.png)" -gt 90000
            test "$(stat -c %s screenshots/07-ice-finger-trail.png)" -gt 90000
            adb shell am start -W -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.auraglass.app/.AuraWallpaperService
            sleep 3
            adb exec-out screencap -p > screenshots/05-wallpaper-preview.png
            adb shell cmd role add-role-holder android.app.role.HOME com.auraglass.app
            adb shell cmd role get-role-holders android.app.role.HOME > screenshots/home-role.txt
            adb shell dumpsys package com.auraglass.app > screenshots/package.txt
            adb shell dumpsys gfxinfo com.auraglass.app > screenshots/gfxinfo.txt || true
            adb logcat -d -v threadtime > screenshots/device-logcat.txt
            grep -q "AuraEventListener" screenshots/package.txt
            grep -q "AuraWallpaperService" screenshots/package.txt
            grep -q "com.auraglass.app" screenshots/home-role.txt
            ! adb logcat -d -s AndroidRuntime:E | grep -F "Process: com.auraglass.app"
            # A blocking system dialog invalidates visual acceptance, even if AURA survived.
            ! grep -E 'ANR in (com[.]android[.]launcher3|com[.]google[.]android[.]apps[.]nexuslauncher)' screenshots/device-logcat.txt
            test "$(stat -c %s screenshots/02-island-collapsed.png)" -gt 90000
            echo "✓ core views and Island opened in emulator"
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuraGlass-development-emulator-screenshots
          path: screenshots/
          if-no-files-found: warn

# No automatic publication. Stable releases require a persistent private signing
# key, real-device verification and an explicit manual release workflow.
